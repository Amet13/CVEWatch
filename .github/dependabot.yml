version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait before proposing a new version: a hijacked release is usually found and
    # pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    # Minor and patch updates in one pull request (merged automatically), majors in
    # another that waits for a person, so one major never holds back the rest.
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]
