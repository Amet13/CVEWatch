# Releases without a clone, a local tag or a manual merge order.
#
# By hand: Actions → autorelease → Run workflow, and pick what to release:
#   - `publish`: release the version that Cargo.toml has now, if it has no release yet
#     (this is how the first release, 3.0.0, goes out). It waits for ci on main's head,
#     then creates the tag and starts release.yml on it. If a release run failed and left
#     a tag with no release, running `publish` again moves the tag to main's head and
#     tries again.
#   - `patch`, `minor`, `major`, `auto`: open a "Release vX.Y.Z" pull request (version in
#     Cargo.toml and the other manifests, CHANGELOG `[Unreleased]` turned into a dated
#     section). When it merges, it is published: by automerge.yml when CI passes, which
#     starts this workflow with `publish`; or, when you merge it yourself, by the push.
#     `auto` is minor when `[Unreleased]` has `### Added`, else patch.
#
# On its own:
#   - monthly, when shipped files changed since the last release, the same as `auto`;
#   - daily, `publish`, as a safety net for anything above that did not run.
#
# A tag made with GITHUB_TOKEN starts no workflow, so release.yml is dispatched on it.
# Versions start at 3.0.0; older tags in this repository are ignored.
name: autorelease

on:
  schedule:
    - cron: "53 6 1 * *"
    - cron: "29 7 * * *"
  # A person merging a release pull request (or a version change) publishes it.
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      release:
        description: publish (release Cargo.toml's version now) or open a release pull request (patch, minor, major, auto)
        type: choice
        options: [publish, patch, minor, major, auto]
        default: publish

permissions:
  contents: read

concurrency:
  group: autorelease
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event.schedule == '53 6 1 * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.release != 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: need
        name: Is a release due?
        env:
          KIND: ${{ inputs.release || 'auto' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          last="$(git tag --list 'v[3-9].*' 'v[1-9][0-9]*.*' --sort=-version:refname | grep -v -- '-' | head -n 1 || true)"
          v="$(bash .github/scripts/release.sh version)"
          if [ -z "$last" ]; then
            echo "::notice::No release exists yet. Run this workflow with 'publish' to release v$v first."
            echo "due=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$last" != "v$v" ]; then
            echo "::notice::Cargo.toml says $v and the last release is $last: run 'publish' to release v$v."
            echo "due=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The monthly run only proposes a release when something shipped changed; a
          # person asking for one gets it.
          if [ "$SCHEDULED" = true ] &&
            git diff --quiet "$last" HEAD -- crates catalog templates docker schema action.yml Cargo.toml Cargo.lock; then
            echo "Nothing shipped changed since $last."
            echo "due=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          next="$(bash .github/scripts/release.sh next "$KIND")"
          {
            echo "last=$last"
            echo "next=$next"
            echo "due=true"
          } >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.due == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - if: steps.need.outputs.due == 'true'
        name: Bump the version and write the changelog
        env:
          LAST: ${{ steps.need.outputs.last }}
          NEXT: ${{ steps.need.outputs.next }}
        run: bash .github/scripts/release.sh bump "$NEXT" "$LAST"
      - if: steps.need.outputs.due == 'true'
        name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.need.outputs.next }}
        run: |
          {
            echo "Release v$NEXT. When this merges (automatically once CI passes), the"
            echo "autorelease workflow tags v$NEXT and starts release.yml: binaries,"
            echo "installers, checksums, the Docker image and the \`v${NEXT%%.*}\` tag."
            echo
            echo "Edit CHANGELOG.md in this pull request if the notes need it."
          } > "$RUNNER_TEMP/body.md"
          bash .github/scripts/automation-pr.sh release "Release v$NEXT" "$RUNNER_TEMP/body.md"

  publish:
    if: >-
      github.event.schedule == '29 7 * * *' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.release == 'publish')
    runs-on: ubuntu-latest
    # Waits for ci on main's head (it runs in parallel with this after a merge).
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and release the version in Cargo.toml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="$(bash .github/scripts/release.sh version)"
          case "$v" in *-*) echo "::notice::$v is a pre-release version; tag it by hand if you mean it."; exit 0 ;; esac
          retag=false
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$v" > /dev/null 2>&1; then
            if gh release view "v$v" > /dev/null 2>&1; then
              echo "v$v is already released."; exit 0
            fi
            # A tag without a GitHub release is a release run that failed before it
            # published anything. Try again from main's head: the tag moves there once
            # ci has passed on it.
            echo "::notice::v$v is tagged but was never released (a failed release run): trying again from $GITHUB_SHA."
            retag=true
          fi
          # ci on this exact commit must pass first. After a merge it is still running:
          # wait for it (up to about 50 minutes), but never release on a red or missing run.
          for _ in $(seq 1 50); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')"
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then break; fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<< "$runs" > /dev/null; then
              echo "::error::ci did not pass on $GITHUB_SHA. Fix main, then run this workflow again."
              exit 1
            fi
            echo "Waiting for ci on $GITHUB_SHA..."
            sleep 60
          done
          if ! jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then
            echo "::error::ci has not passed on $GITHUB_SHA. Run this workflow again once it has."
            exit 1
          fi
          running="$(gh run list --workflow release.yml --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$running" -gt 0 ]; then echo "::notice::A release is already running."; exit 0; fi
          if [ "$retag" = true ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v$v" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$v" -f sha="$GITHUB_SHA" > /dev/null
          fi
          gh workflow run release.yml --ref "v$v"
          {
            echo "### Releasing v$v"
            echo
            echo "Tagged \`v$v\` at \`$GITHUB_SHA\` and started release.yml."
          } >> "$GITHUB_STEP_SUMMARY"
