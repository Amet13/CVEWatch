# The repository's scheduled upkeep, one job per task. Each runs on its own schedule,
# and any one can be started by hand (Actions → maintenance → Run workflow → task).
#   health  Wednesdays: `cargo xtask catalog verify` (every catalog key matches records)
#           and `unpatched db sources-health` (every source answers for one known item).
#           One issue, "Sources need a look", opened or updated on failure and closed
#           when the next run is clean.
#   bench   3rd of the month: `cargo xtask bench` (accuracy against held-out cases),
#           as a pull request. Skipped with a notice when xtask has no bench task yet.
# Pull requests are merged by automerge.yml when CI passes; issues close themselves
# when the next run finds nothing. watchdog.yml reports a failed run.
name: maintenance

on:
  schedule:
    - cron: "37 7 * * 3"
    - cron: "17 4 3 * *"
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        type: choice
        options: [health, bench]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  health:
    name: health
    if: github.event.schedule == '37 7 * * 3' || inputs.task == 'health'
    concurrency:
      group: maintenance-health
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Check the catalog and the sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          cargo build --release --locked -p unpatched
          cargo xtask catalog verify > "$RUNNER_TEMP/catalog.txt" 2>&1
          catalog=$?
          ./target/release/unpatched db sources-health > "$RUNNER_TEMP/sources.txt" 2>&1
          sources=$?
          cat "$RUNNER_TEMP/catalog.txt" "$RUNNER_TEMP/sources.txt"
          set -e
          : > "$RUNNER_TEMP/body.md"
          if [ "$catalog" -ne 0 ] || [ "$sources" -ne 0 ]; then
            {
              echo "The weekly check found problems. Run: $URL"
              if [ "$catalog" -ne 0 ]; then
                echo
                echo "## Catalog (\`cargo xtask catalog verify\`)"
                echo
                echo '```text'
                tail -c 20000 "$RUNNER_TEMP/catalog.txt"
                echo '```'
              fi
              if [ "$sources" -ne 0 ]; then
                echo
                echo "## Sources (\`unpatched db sources-health\`)"
                echo
                echo '```text'
                tail -c 20000 "$RUNNER_TEMP/sources.txt"
                echo '```'
              fi
              echo
              echo "A product whose keys match nothing is shown as unverified, never as safe."
              echo "This issue closes itself when the next weekly run is clean."
            } > "$RUNNER_TEMP/body.md"
          fi
          bash .github/scripts/issue.sh "Sources need a look" "$RUNNER_TEMP/body.md"

  bench:
    name: bench
    if: github.event.schedule == '17 4 3 * *' || inputs.task == 'bench'
    concurrency:
      group: maintenance-bench
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: Is there a bench task?
        id: has
        run: |
          if cargo xtask bench --help > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=bench::xtask has no bench task yet: nothing to do."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.has.outputs.present == 'true'
        run: cargo xtask bench
      - if: steps.has.outputs.present == 'true'
        name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Monthly accuracy benchmark (\`cargo xtask bench\`). The accuracy page shows these numbers."
            echo
            echo "Merged by automerge.yml when CI passes."
          } > "$RUNNER_TEMP/body.md"
          bash .github/scripts/automation-pr.sh bench "bench: monthly results" "$RUNNER_TEMP/body.md"
