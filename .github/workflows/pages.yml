# Builds the guide with mdBook and publishes it to GitHub Pages. Does nothing until
# book.toml exists. The site is served at https://amet13.github.io/unpatched/.
name: pages

on:
  push:
    branches: [main]
    paths:
      - book.toml
      - docs/**
      - catalog/**
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      built: ${{ steps.book.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is there a book?
        id: book
        run: |
          if [ -f book.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=pages::No book.toml yet: nothing to publish."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.book.outputs.present == 'true'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: mdbook
      - if: steps.book.outputs.present == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.book.outputs.present == 'true'
        run: mdbook build
      - if: steps.book.outputs.present == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # mdBook's default output directory; keep in step with `build-dir` in book.toml.
          path: book

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
