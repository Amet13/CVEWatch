#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
# CUSTOM: read-only by default; the jobs that write ask for it themselves.
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  # CUSTOM (kept by allow-dirty in dist-workspace.toml): autorelease.yml starts a
  # release of a tag it created itself, because a tag pushed with GITHUB_TOKEN
  # starts no workflow. Run it on the tag: `gh workflow run release.yml --ref vX.Y.Z`.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    # CUSTOM: only on pull requests and on tags (a manual run on a branch has no release to plan).
    if: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # CUSTOM: install dist from hash-checked downloads, not `curl | sh`.
      - name: Install dist
        uses: ./.github/actions/install-dist
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        env:
          # CUSTOM: the tag goes through the environment, never into the script text.
          TAG_FLAG: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
        run: |
          if [ -n "$TAG_FLAG" ]; then
            dist host --steps=create "$TAG_FLAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    # CUSTOM: no container builds (every target builds on a GitHub runner), so the
    # generated `container:` line and its `curl | sh` rustup step are removed.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # CUSTOM: build with the Rust version pinned in rust-toolchain.toml, not whatever
      # the runner image has. Bump it in rust-toolchain.toml (see MAINTAINING.md).
      - name: Install the pinned Rust
        shell: bash
        env:
          TARGETS: ${{ join(matrix.targets, ' ') }}
        # Every component rust-toolchain.toml lists is installed here, up front. Missing
        # ones would be added by rustup on the first cargo call instead, and cargo-zigbuild
        # (the aarch64 musl build) starts several at once: two rustups adding rustfmt at
        # the same time fail with "detected conflict: 'bin/cargo-fmt'".
        run: |
          set -euo pipefail
          version="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          args=()
          for c in $(sed -n 's/^components *= *\[\(.*\)\]/\1/p' rust-toolchain.toml | tr -d '" ' | tr ',' ' '); do
            args+=(--component "$c")
          done
          for target in $TARGETS; do args+=(--target "$target"); done
          rustup toolchain install "$version" --profile minimal "${args[@]}"
          rustc "+$version" --version
          rustup component list --toolchain "$version" --installed
      # CUSTOM: hash-checked install instead of the generated `curl | sh` / `irm | iex`.
      - name: Install dist
        uses: ./.github/actions/install-dist
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # CUSTOM: the generated step runs an unpinned `pip3 install cargo-zigbuild`; this
      # installs the same tools with pinned hashes, only where the target needs them.
      - name: Install dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          case " $TARGETS " in
            *" aarch64-unknown-linux-musl "*)
              python3 -m venv "$RUNNER_TEMP/zigbuild"
              "$RUNNER_TEMP/zigbuild/bin/pip" install --require-hashes --no-deps -r .github/requirements/zigbuild.txt
              echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
              ;;
          esac
      - name: Build artifacts
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          # Actually do builds and make zips and whatnot
          # shellcheck disable=SC2086
          dist build $TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          # shellcheck disable=SC2086
          dist build $TAG_FLAG --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # CUSTOM: creates the GitHub release.
    permissions:
      "contents": "write"
    runs-on: "ubuntu-latest"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          # shellcheck disable=SC2086
          dist host $TAG_FLAG --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      # CUSTOM: only the build jobs' artifacts are downloaded. `artifacts-*` also matched
      # artifacts-dist-manifest, uploaded by this job a moment ago, and the artifact
      # service does not always serve it yet ("No artifacts found for ID", v3.0.1).
      # The file is already here: it is copied in below.
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
          cp dist-manifest.json artifacts/dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          RELEASE_TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          # CUSTOM: the release is titled by its tag (v3.0.0). dist's title comes from the
          # CHANGELOG heading, "[3.0.0] - 2026-11-24".
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  custom-publish-docker:
    needs:
      - plan
      - host
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    uses: ./.github/workflows/publish-docker.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
    # publish jobs get escalated permissions
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
      "packages": "write"

  # CUSTOM: list the MCP server in the official MCP Registry (server.json), signing in
  # with this workflow's identity (OIDC: no secret). The registry checks that the
  # image has the label io.modelcontextprotocol.server.name (docker/Dockerfile). A failure
  # here never blocks the release: it only leaves the registry entry one version behind,
  # and the job can be re-run.
  custom-publish-mcp-registry:
    needs:
      - plan
      - custom-publish-docker
    if: ${{ always() && needs.custom-publish-docker.result == 'success' && !fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      "contents": "read"
      "id-token": "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ fromJson(needs.plan.outputs.val).announcement_tag }}
      - name: Install mcp-publisher
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  announce:
    needs:
      - plan
      - host
      - custom-publish-docker
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.custom-publish-docker.result == 'skipped' || needs.custom-publish-docker.result == 'success') }}
    runs-on: "ubuntu-latest"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

  # CUSTOM: the Action downloads the release it is told to run. Run it from the release
  # itself on Linux, macOS and Windows (action-e2e.yml), so a broken asset is noticed
  # before the major tag moves.
  action-e2e:
    needs:
      - plan
      - host
    if: ${{ always() && needs.host.result == 'success' }}
    uses: ./.github/workflows/action-e2e.yml
    with:
      version: ${{ fromJson(needs.plan.outputs.val).announcement_tag }}
    permissions:
      "contents": "read"

  # CUSTOM: move the major tag (v3, v4, ...) to this release, so workflows that use
  # `amet13/unpatched@v3` get the newest stable release. It needs only the GitHub release
  # and the action test: a Docker problem must not hold the tag back.
  # Prereleases do not move it, and neither does an older release (a v3.0.5 rebuilt
  # after v3.1.0 leaves v3 where it is).
  move-major-tag:
    needs:
      - plan
      - host
      - action-e2e
    if: ${{ always() && needs.host.result == 'success' && needs.action-e2e.result == 'success' && !fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ fromJson(needs.plan.outputs.val).announcement_tag }}
    steps:
      # No checkout: the tag is moved through the API, so no credentials sit in a
      # git config on disk.
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.*) ;; *) echo "::notice::$TAG is not vX.Y.Z; no major tag moved."; exit 0 ;; esac
          major="${TAG%%.*}"
          # The newest stable tag of this major version, by version order.
          newest="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$major." --paginate --jq '.[].ref' \
            | sed 's#^refs/tags/##' | grep -v -- '-' | sort -V | tail -n 1)"
          if [ "$newest" != "$TAG" ]; then
            echo "::notice::$TAG is older than $newest; $major stays where it is."
            exit 0
          fi
          # The commit the release tag points to (an annotated tag points to a tag object).
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          sha="$(jq -r .object.sha <<<"$ref")"
          if [ "$(jq -r .object.type <<<"$ref")" = "tag" ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$sha" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$sha" > /dev/null
          fi
          echo "::notice::$major now points to $TAG ($sha)"
