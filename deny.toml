# cargo-deny: licenses, advisories, bans and sources. Run by CI (`cargo deny check`)
# and by `cargo xtask check` when cargo-deny is installed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add an id here only with a reason and a date to look at it again.
ignore = [
    # chrono is unmaintained (not vulnerable). Moving to jiff waits for schemars
    # to support jiff 1.x (it supports only jiff 0.2). Revisit when schemars supports jiff 1.x.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained only; migration to jiff blocked on schemars jiff 1.x support" },
]

[licenses]
# Workspace-internal crates that are never published (xtask).
private = { ignore = true }
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
