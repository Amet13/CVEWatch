id: linux-kernel
name: Linux kernel
vendor: Linux
kind: os
versioning: dotted
match:
  cpe:
    - "linux:linux_kernel"
  cna:
    - { vendor: Linux, product: Kernel }
    - { vendor: Linux, product: Linux }
  kev:
    - { vendorProject: Linux, product: Kernel }
eol: linux
aliases: [linux, kernel]
homepage: https://www.kernel.org/
version_hint: "6.1.55 (the numbers `uname -r` starts with, without the distro suffix)"
checked: 2026-11-23
