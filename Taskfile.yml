# CVEWatch Taskfile
# A modern CVE vulnerability monitoring tool
# Task runner: https://taskfile.dev

version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  BUILD_TIME:
    sh: date -u '+%Y-%m-%d_%H:%M:%S'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BINARY_NAME: cvewatch
  GORELEASER_VERSION: v2.14.0

tasks:
  _run-go-tool:
    internal: true
    cmds:
      - |
        GOBIN_DIR="$(go env GOPATH)/bin"
        echo "Installing {{.TOOL_NAME}}..."
        GOTOOLCHAIN=go1.26.3 go install {{.TOOL_PACKAGE}}
        "${GOBIN_DIR}/{{.TOOL_BIN}}" {{.TOOL_ARGS}}

  default:
    desc: Show available tasks
    cmds:
      - task -l

  # Dependencies
  deps:
    desc: Download and verify dependencies
    cmds:
      - go mod download

  deps-tidy:
    desc: Tidy and verify go.mod/go.sum
    cmds:
      - go mod tidy
      - go mod verify

  # Building
  build:
    desc: Build the application with version info
    deps:
      - deps
    cmds:
      - echo "Building CVEWatch..."
      - |
        go build \
          -ldflags="-X 'cvewatch/pkg/version.Version={{.VERSION}}' \
                    -X 'cvewatch/pkg/version.BuildTime={{.BUILD_TIME}}' \
                    -X 'cvewatch/pkg/version.GitCommit={{.GIT_COMMIT}}' \
                    -s -w" \
          -o {{.BINARY_NAME}} ./cmd/cvewatch

  build-native:
    desc: Build for current platform (development)
    cmds:
      - echo "Building CVEWatch for current platform..."
      - go build -o {{.BINARY_NAME}} ./cmd/cvewatch

  cross-build:
    desc: Build for multiple platforms (linux, darwin, windows)
    deps:
      - deps
    cmds:
      - echo "Building for multiple platforms..."
      - |
        for os in linux darwin windows; do
          for arch in amd64 arm64; do
            if [ "$os" = "windows" ] && [ "$arch" = "arm64" ]; then
              continue
            fi
            echo "Building for $os/$arch..."
            BINARY_NAME={{.BINARY_NAME}}
            if [ "$os" = "windows" ]; then
              BINARY_NAME={{.BINARY_NAME}}.exe
            fi
            GOOS=$os GOARCH=$arch go build \
              -ldflags="-s -w" \
              -o ${BINARY_NAME}-${os}-${arch} ./cmd/cvewatch
          done
        done
      - echo "Cross-platform builds completed!"

  # Testing
  test:
    desc: Run all tests
    cmds:
      - echo "Running tests..."
      - go test -v ./...

  test-race:
    desc: Run tests with race detection
    cmds:
      - echo "Running tests with race detection..."
      - go test -race -v ./...

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - echo "Running tests with coverage..."
      - go test -coverprofile=coverage.out -covermode=atomic ./...
      - go tool cover -html=coverage.out -o coverage.html
      - |
        echo "Coverage report generated: coverage.html"
        echo "Coverage summary:"
        go tool cover -func=coverage.out | tail -1

  # Code Quality
  format:
    desc: Format code with gofmt and goimports
    cmds:
      - echo "Formatting code..."
      - go fmt ./...
      - task: _run-go-tool
        vars:
          TOOL_NAME: goimports
          TOOL_PACKAGE: golang.org/x/tools/cmd/goimports@v0.42.0
          TOOL_BIN: goimports
          TOOL_ARGS: -w .

  check-fmt:
    desc: Check if code is properly formatted
    cmds:
      - echo "Checking code formatting..."
      - |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Code is not properly formatted. Run 'task format' to fix."
          gofmt -l .
          exit 1
        fi
      - echo "Code is properly formatted."

  lint:
    desc: Run linters (golangci-lint v2)
    cmds:
      - echo "Running linters..."
      - task: _run-go-tool
        vars:
          TOOL_NAME: golangci-lint
          TOOL_PACKAGE: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          TOOL_BIN: golangci-lint
          TOOL_ARGS: run

  security-scan:
    desc: Run security scanner (gosec)
    cmds:
      - echo "Running security scan..."
      - task: _run-go-tool
        vars:
          TOOL_NAME: gosec
          TOOL_PACKAGE: github.com/securego/gosec/v2/cmd/gosec@v2.23.0
          TOOL_BIN: gosec
          TOOL_ARGS: -fmt=json -out=security-report.json -severity=medium -confidence=medium ./...
      - echo "Security scan completed. Report saved to security-report.json"

  vuln-check:
    desc: Run Go vulnerability database check (govulncheck)
    cmds:
      - echo "Running govulncheck..."
      - task: _run-go-tool
        vars:
          TOOL_NAME: govulncheck
          TOOL_PACKAGE: golang.org/x/vuln/cmd/govulncheck@v1.1.4
          TOOL_BIN: govulncheck
          TOOL_ARGS: ./...
      - echo "Vulnerability check completed."

  # Installation
  install:
    desc: Install the application
    deps:
      - build
    cmds:
      - echo "Installing CVEWatch..."
      - |
        if [ -w /usr/local/bin ]; then
          sudo cp {{.BINARY_NAME}} /usr/local/bin/
          echo "CVEWatch installed to /usr/local/bin/"
        else
          echo "Installing to ~/.local/bin/"
          mkdir -p ~/.local/bin
          cp {{.BINARY_NAME}} ~/.local/bin/
          echo "CVEWatch installed to ~/.local/bin/"
          echo "Add ~/.local/bin to your PATH if not already there"
        fi

  uninstall:
    desc: Uninstall the application
    cmds:
      - echo "Uninstalling CVEWatch..."
      - |
        if [ -f /usr/local/bin/{{.BINARY_NAME}} ]; then
          sudo rm -f /usr/local/bin/{{.BINARY_NAME}}
          echo "CVEWatch removed from /usr/local/bin/"
        fi
      - |
        if [ -f ~/.local/bin/{{.BINARY_NAME}} ]; then
          rm -f ~/.local/bin/{{.BINARY_NAME}}
          echo "CVEWatch removed from ~/.local/bin/"
        fi

  # Cleanup
  clean:
    desc: Clean build artifacts
    cmds:
      - echo "Cleaning build artifacts..."
      - rm -f {{.BINARY_NAME}} {{.BINARY_NAME}}.exe
      - rm -f coverage.out coverage.html
      - rm -f security-report.json
      - find . -maxdepth 1 -name "{{.BINARY_NAME}}-*" -type f -delete 2>/dev/null || true
      - find . -maxdepth 1 -name "*.exe" -type f -delete 2>/dev/null || true
      - go clean

  # Release
  release:
    desc: Create release with GoReleaser
    cmds:
      - echo "Creating release with GoReleaser..."
      - git checkout -- .
      - git clean -fd
      - task: _run-go-tool
        vars:
          TOOL_NAME: GoReleaser
          TOOL_PACKAGE: github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}}
          TOOL_BIN: goreleaser
          TOOL_ARGS: release --clean

  release-snapshot:
    desc: Create snapshot release (for testing)
    cmds:
      - echo "Creating snapshot release..."
      - task: _run-go-tool
        vars:
          TOOL_NAME: GoReleaser
          TOOL_PACKAGE: github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}}
          TOOL_BIN: goreleaser
          TOOL_ARGS: release --snapshot --clean

  release-check:
    desc: Validate GoReleaser configuration
    cmds:
      - echo "Validating GoReleaser configuration..."
      - task: _run-go-tool
        vars:
          TOOL_NAME: GoReleaser
          TOOL_PACKAGE: github.com/goreleaser/goreleaser/v2@{{.GORELEASER_VERSION}}
          TOOL_BIN: goreleaser
          TOOL_ARGS: check

  # Development
  dev-setup:
    desc: Set up development environment
    deps:
      - deps
      - deps-tidy
    cmds:
      - echo "Setting up development environment..."
      - |
        GOTOOLCHAIN=go1.26.3 go install \
          github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1 \
          golang.org/x/tools/cmd/goimports@v0.42.0 \
          github.com/securego/gosec/v2/cmd/gosec@v2.23.0
      - echo "Development environment ready."

  # Pre-commit and CI tasks
  pre-commit:
    desc: Run all pre-commit checks
    deps:
      - check-fmt
      - test
      - lint
      - security-scan
    cmds:
      - echo "All pre-commit checks passed!"

  ci-quality:
    desc: Run CI quality checks
    deps:
      - deps-tidy
      - check-fmt
      - lint
      - security-scan
      - vuln-check
    cmds:
      - echo "All CI quality checks passed!"

  ci-test:
    desc: Run CI test suite
    deps:
      - deps
      - test-race
      - test-coverage
    cmds:
      - echo "All CI tests passed!"

  ci-build:
    desc: Run CI build
    deps:
      - deps
      - build
    cmds:
      - echo "Testing installation..."
      - |
        if [ -w /usr/local/bin ]; then
          sudo cp {{.BINARY_NAME}} /usr/local/bin/ 2>/dev/null || true
          /usr/local/bin/{{.BINARY_NAME}} version 2>/dev/null || true
        else
          mkdir -p ~/.local/bin 2>/dev/null || true
          cp {{.BINARY_NAME}} ~/.local/bin/ 2>/dev/null || true
          ~/.local/bin/{{.BINARY_NAME}} version 2>/dev/null || true
        fi

  ci-release:
    desc: Run CI release
    deps:
      - release
    cmds:
      - echo "CI release completed!"
